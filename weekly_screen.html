<body class="bg-surface-container-lowest text-on-surface font-body w-full max-w-[390px] mx-auto min-h-screen relative overflow-x-hidden flex flex-col pb-24">
<!-- Header Section -->
<header class="px-lg pt-2lg pb-xl"><div class="items-center w-full">
  <h1 class="font-h1-mobile text-h1-mobile mb-lg tracking-tight">Jadwal</h1>
  <div class="flex p-1 bg-surface-container-high rounded-full mb-lg mt-lg">
    <button class="px-6 py-2 rounded-full text-on-surface-variant font-label-medium text-label-medium hover:text-on-surface transition-colors">Hari ini</button>
    <button class="px-6 py-2 rounded-full bg-primary text-on-primary font-label-medium text-label-medium transition-colors">Minggu ini</button>
  </div>
</div></header>
<!-- Weekly Calendar Strip -->
<div class="px-lg py-sm flex items-center justify-between overflow-x-auto no-scrollbar gap-sm">
<!-- Inactive Day -->
<div class="flex flex-col items-center justify-center min-w-[40px]">
<span class="font-metadata text-metadata text-outline mb-xs">Sen</span>

</div>
<!-- Active Day -->
<div class="flex flex-col items-center justify-center min-w-[40px] relative">
<span class="font-metadata text-metadata text-primary mb-xs">Sel</span>

<div class="w-[4px] h-[4px] rounded-full bg-primary mt-1 absolute bottom-0"></div>
</div>
<!-- Inactive Days -->
<div class="flex flex-col items-center justify-center min-w-[40px]">
<span class="font-metadata text-metadata text-outline mb-xs">Rab</span>

</div>
<div class="flex flex-col items-center justify-center min-w-[40px]">
<span class="font-metadata text-metadata text-outline mb-xs">Kam</span>

</div>
<div class="flex flex-col items-center justify-center min-w-[40px]">
<span class="font-metadata text-metadata text-outline mb-xs">Jum</span>

</div>
<div class="flex flex-col items-center justify-center min-w-[40px]">
<span class="font-metadata text-metadata text-outline mb-xs">Sab</span>

</div>
<div class="flex flex-col items-center justify-center min-w-[40px]">
<span class="font-metadata text-metadata text-outline mb-xs">Min</span>

</div>
</div>
<!-- Main Content / Agenda -->
<main class="px-lg py-md flex-1 flex flex-col gap-base">
<!-- Date Navigator -->
<div class="flex items-center justify-between py-xs mb-xs">
<button class="text-on-surface-variant hover:text-primary transition-colors flex items-center justify-center w-8 h-8 rounded-full">
<span class="material-symbols-outlined text-xl">chevron_left</span>
</button>
<h2 class="font-label-medium text-label-medium text-primary uppercase tracking-wide">Selasa, 1 September</h2>
<button class="text-on-surface-variant hover:text-primary transition-colors flex items-center justify-center w-8 h-8 rounded-full">
<span class="material-symbols-outlined text-xl">chevron_right</span>
</button>
</div>
<!-- Agenda Cards -->
<!-- Card 1: Sage -->
<article class="bg-accent-sage rounded-2xl p-base flex gap-base items-start">
<div class="w-[40px] h-[40px] bg-ink-on-dark rounded-xl flex items-center justify-center shrink-0">
<span class="material-symbols-outlined text-white text-[20px]" style="font-variation-settings: 'FILL' 1;">code</span>
</div>
<div class="flex-1">
<h3 class="font-h2 text-h2 text-primary mb-xs">Pemrograman Web</h3>
<div class="flex flex-col gap-1 mt-1">
<div class="flex items-center text-on-surface-variant font-metadata text-metadata gap-2">
<span class="material-symbols-outlined text-[16px]">schedule</span>
                        10.00–11.40
                    </div>
<div class="flex items-center text-on-surface-variant font-metadata text-metadata gap-2">
<span class="material-symbols-outlined text-[16px]">location_on</span>
                        Ruang Lab 2
                    </div>
</div>
</div>
<button class="flex items-center justify-center self-center mr-2 shrink-0 w-9 h-9 bg-surface-container-lowest rounded-full shadow-sm text-on-surface-variant hover:text-primary transition-colors active:scale-95"><span class="material-symbols-outlined text-[20px]">edit</span></button></article>
<!-- Card 2: Mint -->
<article class="bg-accent-mint rounded-2xl p-base flex gap-base items-start">
<div class="w-[40px] h-[40px] bg-ink-on-dark rounded-xl flex items-center justify-center shrink-0">
<span class="material-symbols-outlined text-white text-[20px]" style="font-variation-settings: 'FILL' 1;">dataset</span>
</div>
<div class="flex-1">
<h3 class="font-h2 text-h2 text-primary mb-xs">Basis Data</h3>
<div class="flex flex-col gap-1 mt-1">
<div class="flex items-center text-on-surface-variant font-metadata text-metadata gap-2">
<span class="material-symbols-outlined text-[16px]">schedule</span>
                        13.00–14.40
                    </div>
<div class="flex items-center text-on-surface-variant font-metadata text-metadata gap-2">
<span class="material-symbols-outlined text-[16px]">location_on</span>
                        Ruang C-203
                    </div>
</div>
</div>
<button class="flex items-center justify-center self-center mr-2 shrink-0 w-9 h-9 bg-surface-container-lowest rounded-full shadow-sm text-on-surface-variant hover:text-primary transition-colors active:scale-95"><span class="material-symbols-outlined text-[20px]">edit</span></button></article>
</main>
<!-- Bottom Navigation Bar (Shared Component) -->
<nav class="fixed bottom-0 w-full z-50 flex justify-around items-center px-base py-sm max-w-[390px] mx-auto left-0 right-0 bg-surface-container-lowest dark:bg-surface-container-lowest shadow-[0px_-2px_8px_rgba(0,0,0,0.06)] rounded-t-xl">
<!-- Beranda (Inactive) -->
<button class="flex flex-col items-center justify-center hover:bg-surface-container-low transition-colors active:scale-90 p-2 rounded-xl text-outline">
<span class="material-symbols-outlined mb-1">home</span>
<span class="font-metadata text-metadata">Beranda</span>
</button>
<!-- Jadwal (Active) -->
<button class="flex flex-col items-center justify-center bg-secondary-container text-on-secondary-container rounded-full px-4 py-1 hover:bg-surface-container-low transition-colors active:scale-90">
<span class="material-symbols-outlined mb-1" style="font-variation-settings: 'FILL' 1;">calendar_month</span>
<span class="font-metadata text-metadata font-bold text-primary">Jadwal</span>
</button>
<!-- Tugas (Inactive) -->
<button class="flex flex-col items-center justify-center hover:bg-surface-container-low transition-colors active:scale-90 p-2 rounded-xl text-outline">
<span class="material-symbols-outlined mb-1">assignment</span>
<span class="font-metadata text-metadata">Tugas</span>
</button>
<!-- Proyek (Inactive) -->
<button class="flex flex-col items-center justify-center hover:bg-surface-container-low transition-colors active:scale-90 p-2 rounded-xl text-outline">
<span class="material-symbols-outlined mb-1">folder_open</span>
<span class="font-metadata text-metadata">Proyek</span>
</button>
</nav>


<button aria-label="Tambah Jadwal" class="fixed bottom-24 right-6 w-[56px] h-[56px] bg-ink-on-dark text-white rounded-full flex items-center justify-center shadow-lg z-50 active:scale-95 transition-transform">
  <span class="material-symbols-outlined text-[24px]">add</span>
</button>
