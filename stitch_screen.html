<body class="bg-white min-h-screen flex flex-col items-center antialiased">
<div class="w-full max-w-[390px] h-[844px] bg-white flex flex-col relative overflow-hidden shadow-2xl">
<!-- Header from Component Data -->
<header class="w-full top-0 sticky bg-background dark:bg-ink-on-dark flex items-center justify-between px-lg py-md w-full max-w-screen-xl mx-auto z-10">
<button class="active:scale-95 transition-transform duration-200 text-primary dark:text-on-primary hover:opacity-80 transition-opacity flex items-center justify-center p-2 rounded-full focus:outline-none focus:ring-2 focus:ring-primary/20">
<span aria-hidden="true" class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<div class="font-h1-mobile text-h1-mobile font-bold text-tertiary dark:text-on-tertiary truncate px-2">
                Student Command Center
            </div>
<div class="w-10"></div> <!-- Placeholder for balancing flex layout since trailing icon is removed per prompt request for a simple back arrow, though the component specifies an account circle, the prompt asked for "simple back arrow icon on the left". Assuming we follow the prompt's specific visual constraints for this screen type. If strict adherence to the JSON trailing icon is needed, we would add the account circle here. Adding an empty div to maintain centering. -->
</header>
<!-- Main Content -->
<main class="flex-grow flex flex-col px-6 pt-xl pb-lg overflow-y-auto">
<div class="mb-xl">
<h1 class="font-h1 text-h1 text-primary mb-2">Buat akun</h1>
<p class="font-body text-body text-on-surface-variant">Mulai pusat kendali akademikmu.</p>
</div>
<form class="flex flex-col gap-base flex-grow">
<!-- Nama Field -->
<div class="flex flex-col gap-xs">
<label class="font-label-medium text-label-medium text-primary ml-1" for="nama">Nama</label>
<input class="w-full bg-white border border-muted-divider rounded-16px px-4 py-3 font-body text-body text-primary placeholder:text-on-tertiary-container focus:outline-none focus:ring-1 focus:ring-primary focus:border-primary transition-colors" id="nama" name="nama" placeholder="Masukkan nama" type="text"/>
</div>
<!-- Email Field -->
<div class="flex flex-col gap-xs">
<label class="font-label-medium text-label-medium text-primary ml-1" for="email">Email</label>
<input class="w-full bg-white border border-muted-divider rounded-16px px-4 py-3 font-body text-body text-primary placeholder:text-on-tertiary-container focus:outline-none focus:ring-1 focus:ring-primary focus:border-primary transition-colors" id="email" name="email" placeholder="Masukkan email" type="email"/>
</div>
<!-- Password Field -->
<div class="flex flex-col gap-xs">
<label class="font-label-medium text-label-medium text-primary ml-1" for="password">Password</label>
<div class="relative">
<input class="w-full bg-white border border-muted-divider rounded-16px px-4 py-3 pr-12 font-body text-body text-primary placeholder:text-on-tertiary-container focus:outline-none focus:ring-1 focus:ring-primary focus:border-primary transition-colors" id="password" name="password" placeholder="Masukkan password" type="password"/>
<button class="absolute right-4 top-1/2 -translate-y-1/2 text-on-tertiary-container hover:text-primary transition-colors focus:outline-none flex items-center justify-center p-1 rounded-full" type="button">
<span aria-hidden="true" class="material-symbols-outlined text-[20px]" data-icon="visibility">visibility</span>
</button>
</div>
</div>
<div class="mt-xl flex flex-col gap-6 items-center">
<button class="w-full bg-ink-on-dark text-on-tertiary font-h2 text-h2 py-4 rounded-full active:scale-95 transition-transform duration-200 shadow-sm focus:outline-none focus:ring-2 focus:ring-ink-on-dark/20 focus:ring-offset-2" type="submit">
                        BUAT AKUN
                    </button>
<a class="font-label-medium text-label-medium text-on-surface-variant hover:text-primary transition-colors" href="#">
                        Sudah punya akun? <span class="font-semibold text-primary underline decoration-muted-divider underline-offset-4">Masuk</span>
</a>
</div>
</form>
</main>
<!-- Footer -->
<footer class="w-full pb-8 pt-4 px-6 text-center">
<p class="font-metadata text-metadata text-on-tertiary-container">
                Student Command Center · Personal academic workspace
            </p>
</footer>
</div>
<script>
        // Simple password toggle logic
        document.addEventListener('DOMContentLoaded', () => {
            const passwordInput = document.getElementById('password');
            const toggleButton = passwordInput.nextElementSibling;
            const iconSpan = toggleButton.querySelector('.material-symbols-outlined');

            toggleButton.addEventListener('click', () => {
                if (passwordInput.type === 'password') {
                    passwordInput.type = 'text';
                    iconSpan.textContent = 'visibility_off';
                    iconSpan.setAttribute('data-icon', 'visibility_off');
                } else {
                    passwordInput.type = 'password';
                    iconSpan.textContent = 'visibility';
                    iconSpan.setAttribute('data-icon', 'visibility');
                }
            });
        });
    </script>
